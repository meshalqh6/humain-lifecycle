name: humain-lifecycle
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Run scripts/setup.ps1}
      POSTGRES_USER: ${POSTGRES_USER:?Run scripts/setup.ps1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres-test:
    image: postgres:17-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: humain_test
      POSTGRES_USER: humain_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Run scripts/setup.ps1}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U humain_test -d humain_test']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
